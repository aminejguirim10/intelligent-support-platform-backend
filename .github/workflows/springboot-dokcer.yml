name: Spring Boot CI + Docker

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

  push_to_docker_hub:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/intelligent-support-platform-backend:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/intelligent-support-platform-backend:${{ github.sha }}

      - name: Tag latest
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/intelligent-support-platform-backend:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/intelligent-support-platform-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/intelligent-support-platform-backend:latest
